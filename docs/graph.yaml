template: {headings: [Purpose, Tests, Changes, Gate, Risks]}
gate:
  command: 'npm run test:unit:cov; u=$?; npm run test:e2e; e=$?; exit $((u|e))'
  fail_pattern: '^\s*FAIL\s+tests/\S+|^\s*✘\s+\d+ \[(desktop|mobile)\] › tests/\S+ › .* \(retry #1\)'
  known_red:
    - '[desktop] › tests/e2e/fx-tier2-genie.spec.js:235:7 › Tier 2 genie (forced, no-preference) › context-loss mid-genie-minimize leaves the window visible (finally-invariant holds even with GL gone)'
out_of_scope:
  - {glob: "content/posts/", reason: "the owner's writing; nodes never change the owner's words"}
  - {glob: "static/fonts/", reason: "vendored Fira Code and Fira Sans web fonts"}
  - {glob: "static/images/", reason: "binary images"}
  - {glob: "static/*.jpg", reason: "binary images"}
  - {glob: "static/*.png", reason: "binary images"}
  - {glob: "static/*.gif", reason: "binary images"}
  - {glob: "static/*.webp", reason: "binary images"}
  - {glob: "docs/superpowers/", reason: "design and plan documents of work already merged; history, not plans"}
  - {glob: "LICENSE", reason: "legal text (MIT, code)"}
  - {glob: "LICENSE-CONTENT", reason: "legal text (CC BY-SA 4.0, content)"}
  - {glob: ".hugo_build.lock", reason: "generated by Hugo"}
  - {glob: "commands.txt", reason: "the owner's personal scratch, not part of the site or its build"}
  - {glob: "qa-resume-compare.js", reason: "the owner's ad-hoc screenshot script, not part of the site or its build"}
adoption:
  areas:
    - name: iconostat-fx
      globs:
        - "assets/iconostat/fx/"
        - "tests/unit/compositor*.test.js"
        - "tests/unit/fx-*.test.js"
        - "tests/unit/genie.test.js"
        - "tests/unit/snapshot.test.js"
        - "tests/unit/wobble.test.js"
        - "tests/unit/stubs/"
        - "tests/e2e/fx-*.spec.js"
    - name: site
      globs:
        - "assets/js/"
        - "assets/css/"
        - "assets/jsconfig.json"
        - "hugo.toml"
        - "layouts/home.html"
        - "layouts/pages/"
        - "layouts/partials/"
        - "layouts/posts/"
        - "layouts/shortcodes/"
        - "layouts/writings/"
        - "content/_index.md"
        - "content/intro.md"
        - "content/resume.md"
        - "content/welcome.md"
        - "content/writings.md"
        - "static/*.html"
        - "static/src/"
        - "tests/unit/env.test.js"
        - "tests/e2e/boot.spec.js"
        - "tests/e2e/chrome.spec.js"
        - "tests/e2e/desktop.spec.js"
        - "tests/e2e/dragresize.spec.js"
        - "tests/e2e/imagezoom.spec.js"
        - "tests/e2e/reflow.spec.js"
        - "tests/e2e/selection.spec.js"
        - "tests/e2e/state.spec.js"
        - "tests/e2e/windows.spec.js"
        - "tests/e2e/zorder.spec.js"
        - "tests/mobile/"
nodes:
  - id: T01
    name: test-harness
    status: imported
    track: done
    deps: []
    owns:
      - "package.json"
      - "package-lock.json"
      - "vitest.config.js"
      - "playwright.config.js"
      - "coverage.config.js"
      - "tests/e2e/fixtures.js"
      - "tests/e2e/helpers.js"
      - "tests/e2e/coverage-setup.js"
      - "tests/e2e/coverage-teardown.js"
  - id: T02
    name: ci-tests
    status: imported
    track: done
    deps: [T01]
    owns:
      - ".github/workflows/test.yml"
  - id: T03
    name: deploy
    status: imported
    track: done
    deps: []
    owns:
      - ".github/workflows/deploy-to-s3.yml"
  - id: T04
    name: repo-files
    status: imported
    track: done
    deps: []
    owns:
      - "README.md"
      - ".gitignore"
      - ".gitmodules"
  - id: I01
    name: geometry
    status: imported
    track: done
    deps: [T01]
    owns:
      - "assets/iconostat/geometry.js"
      - "tests/unit/geometry.test.js"
  - id: I02
    name: window-manager
    status: imported
    track: done
    deps: [T01, I01]
    owns:
      - "assets/iconostat/index.js"
      - "assets/iconostat/desktop.js"
      - "assets/iconostat/window.js"
      - "assets/iconostat/menu.js"
      - "assets/iconostat/taskbar.js"
      - "assets/iconostat/iconostat.css"
      - "assets/iconostat/README.md"
  - id: I03
    name: standalone-fixture
    status: imported
    track: done
    deps: [T01, I02]
    owns:
      - "assets/iconostat-fixture/"
      - "content/iconostat-fixture.md"
      - "layouts/_default/iconostat-fixture.html"
      - "tests/e2e/iconostat-fixture.spec.js"
