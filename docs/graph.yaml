template: {headings: [Purpose, Tests, Changes, Gate, Risks]}
gate:
  command: 'npm run test:unit:cov; u=$?; npm run test:e2e; e=$?; exit $((u|e))'
  fail_pattern: '^\s*FAIL\s+tests/\S+|^\s*✘\s+\d+ \[(desktop|mobile)\] › tests/\S+ › .* \(retry #1\)'
  known_red:
    - '[desktop] › tests/e2e/fx-tier2-genie.spec.js:235:7 › Tier 2 genie (forced, no-preference) › context-loss mid-genie-minimize leaves the window visible (finally-invariant holds even with GL gone)'
out_of_scope:
  - {glob: "content/posts/", reason: "the owner's writing; nodes never change the owner's words"}
  - {glob: "static/fonts/", reason: "vendored Fira Code and Fira Sans web fonts"}
  - {glob: "static/images/", reason: "binary images"}
  - {glob: "static/*.jpg", reason: "binary images"}
  - {glob: "static/*.png", reason: "binary images"}
  - {glob: "static/*.gif", reason: "binary images"}
  - {glob: "static/*.webp", reason: "binary images"}
  - {glob: "docs/superpowers/", reason: "design and plan documents of work already merged; history, not plans"}
  - {glob: "LICENSE", reason: "legal text (MIT, code)"}
  - {glob: "LICENSE-CONTENT", reason: "legal text (CC BY-SA 4.0, content)"}
  - {glob: ".hugo_build.lock", reason: "generated by Hugo"}
  - {glob: "commands.txt", reason: "the owner's personal scratch, not part of the site or its build"}
  - {glob: "qa-resume-compare.js", reason: "the owner's ad-hoc screenshot script, not part of the site or its build"}
nodes:
  - id: T01
    name: test-harness
    status: imported
    track: done
    deps: []
    owns:
      - "package.json"
      - "package-lock.json"
