      - "playwright.config.js"
      - "coverage.config.js"
      - "tests/e2e/fixtures.js"
      - "tests/e2e/helpers.js"
      - "tests/e2e/coverage-setup.js"
      - "tests/e2e/coverage-teardown.js"
  - id: T02
    name: ci-tests
    status: imported
    track: done
    deps: [T01]
    owns:
