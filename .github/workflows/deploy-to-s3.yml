name: Deploy Frontend to Cloudflare Workers

on:
  push:
    branches:
      - main  # Run this workflow on pushes to the main branch
  workflow_dispatch:  # Allow manual triggering

jobs:
  deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
    # Step 1: Checkout the repository
    - name: Checkout Code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    # Step 2: Install Hugo (pinned, checksum-verified)
    - name: Install Hugo (pinned + checksum-verified)
      run: |
        set -euo pipefail
        workdir="$(mktemp -d)"
        cd "$workdir"
        tarball="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
        base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
        curl -fsSL -o "$tarball" "$base/$tarball"
        curl -fsSL -o checksums.txt "$base/hugo_${HUGO_VERSION}_checksums.txt"
        # Verify the downloaded tarball against Hugo's published checksum.
        # A mismatch aborts the job (a tampered binary must not build the site).
        grep " ${tarball}\$" checksums.txt | sha256sum -c -
        tar -xzf "$tarball" hugo
        sudo install -m 0755 hugo /usr/local/bin/hugo
        cd - >/dev/null
        hugo version

    # Step 3: Build
    - name: Build
      run: hugo --minify

    # Step 3.5: List built files for debugging
    - name: List built files for debugging
      run: find dist

    # Step 3.6: Generate an SPDX SBOM of the built site
    - name: Generate SBOM (SPDX) of dist/
      id: sbom
      continue-on-error: true
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        path: ./dist
        format: spdx-json
        output-file: sbom.spdx.json
        upload-artifact: false

    # Step 3.7: Publish the SBOM into the deployed artifact and flag any dependency-hygiene concerns
    - name: Publish SBOM into the deployed artifact + dependency-hygiene finding
      continue-on-error: true
      run: |
        set -euo pipefail
        if [ ! -f sbom.spdx.json ]; then
          echo "::warning::SBOM was not generated; deploying without /.well-known/sbom.spdx.json"
          exit 0
        fi
        mkdir -p dist/.well-known
        cp sbom.spdx.json dist/.well-known/sbom.spdx.json
        count=$(python3 -c "import json; print(len(json.load(open('sbom.spdx.json')).get('packages', [])))")
        echo "SBOM package count: $count"
        if [ "$count" -gt 10 ]; then
          echo "::warning::SBOM lists $count packages (>10) — unexpected for a static artifact; investigate the supply chain."
        fi

    # Step 3.8: Upload the SBOM as a build artifact
    - name: Upload SBOM artifact
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sbom-spdx
        path: sbom.spdx.json

    # Step 4: Node 22 for Wrangler 4 (needs Node >= 22.12)
    - name: Set up Node.js 22 for Wrangler
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'

    # Step 5: Deploy ./dist to Cloudflare Workers static assets (see wrangler.jsonc)
    - name: Deploy to Cloudflare Workers
      uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
      with:
        # v3's default Wrangler (3.90.0) cannot read wrangler.jsonc
        wranglerVersion: '4.168.0'
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: deploy

    # Step 6: Package the deployed artifact and attest SLSA build provenance.
    # These steps run only after a successful deploy; a failure here can
    # never block the already-completed deploy.
    - name: Package built artifact for attestation
      run: tar -czf dist.tgz -C dist .

    - name: Attest build provenance
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
      with:
        subject-path: dist.tgz

    - name: Upload built artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: site-dist
        path: dist.tgz
